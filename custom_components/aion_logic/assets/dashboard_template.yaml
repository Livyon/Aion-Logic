views:
  - title: Home
    sections:
      - "0":
          type: vertical-stack
          cards:
            - type: custom:bubble-card
              card_type: pop-up
              hash: "#Security"
              name: Beveiliging
              icon: mdi:shield-check
              margin_top_mobile: 56px
              button_type: name
              auto_close: "30000"
            - type: custom:auto-entities
              card:
                type: grid
                columns: 1
                square: false
              card_param: cards
              filter:
                include:
                  - domain: alarm_control_panel
                    options:
                      type: alarm-panel
                      states:
                        - arm_home
                        - arm_away
                      name: Systeem Status
              show_empty: false
            - type: custom:bubble-card
              card_type: separator
              name: Sensoren Status
              icon: mdi:window-closed-variant
            - type: custom:auto-entities
              card:
                type: grid
                columns: 1
                square: false
              card_param: cards
              filter:
                include:
                  - domain: binary_sensor
                    state: "on"
                    attributes:
                      device_class: window
                    options:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      show_state: true
                      icon: mdi:window-open-variant
                      styles: |
                        .bubble-icon { color: var(--error-color) !important; }
                  - domain: binary_sensor
                    state: "on"
                    attributes:
                      device_class: door
                    options:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      show_state: true
                      icon: mdi:door-open
                      styles: |
                        .bubble-icon { color: var(--error-color) !important; }
                  - domain: binary_sensor
                    state: "on"
                    attributes:
                      device_class: motion
                    options:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      name: Beweging Gedetecteerd
                      icon: mdi:motion-sensor
                      styles: |
                        .bubble-icon { color: var(--warning-color) !important; }
                exclude:
                  - state: unavailable
                  - state: unknown
              else:
                type: custom:bubble-card
                card_type: button
                button_type: name
                name: Alles is veilig gesloten
                icon: mdi:check-circle
                styles: |
                  .bubble-icon { color: var(--success-color) !important; }
      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |
            {% for alarm in states.alarm_control_panel %}
              {% if alarm.state == 'triggered' or alarm.state == 'pending' %}
                {# SCENARIO 1: ALARM GAAT AF (ROOD & KNIPPEREND) #}
                {{
                  {
                    'type': 'custom:bubble-card',
                    'card_type': 'button',
                    'button_type': 'name',
                    'entity': alarm.entity_id,
                    'name': 'ALARM GEACTIVEERD!',
                    'icon': 'mdi:alert-box',
                    'styles': "
                      .bubble-button-card-container {
                        background: red !important;
                        animation: flash 1s infinite;
                      }
                      .bubble-name, .bubble-icon {
                        color: white !important;
                        font-weight: bold;
                      }
                      @keyframes flash {
                        0% { opacity: 1; }
                        50% { opacity: 0.6; }
                        100% { opacity: 1; }
                      }
                    ",
                    'button_action': {
                      'tap_action': {
                        'action': 'navigate',
                        'navigation_path': '#Security'
                      }
                    }
                  }
                }},
              {% elif alarm.state != 'disarmed' %}
                {# SCENARIO 2: ALARM STAAT AAN (GROEN/NORMAAL) #}
                {{
                  {
                    'type': 'custom:bubble-card',
                    'card_type': 'button',
                    'button_type': 'name',
                    'entity': alarm.entity_id,
                    'name': 'Systeem Ingeschakeld',
                    'icon': 'mdi:shield-lock',
                    'styles': "
                      .bubble-button-card-container {
                        background: var(--primary-color) !important;
                        opacity: 0.8;
                      }
                      .bubble-icon {
                        color: white !important;
                      }
                    ",
                    'button_action': {
                      'tap_action': {
                        'action': 'navigate',
                        'navigation_path': '#Security'
                      }
                    }
                  }
                }},
              {% endif %}
            {% endfor %}
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Info & Planning
            icon: mdi:information-variant
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - domain: weather
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        name: null
                        show_state: true
                        show_attribute: true
                        attribute: temperature
                        icon: mdi:weather-partly-cloudy
                        scrolling_effect: false
                show_empty: false
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Info & Status
                icon: mdi:information-box-outline
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: "#Info"
                card_mod:
                  style: |
                    .bubble-icon {
                      color: var(--state-icon-color) !important;
                    }
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Info"
                name: Info Centrum
                icon: mdi:information
                margin_top_mobile: 56px
                styles: |
                  /* Target de container die alles afkapt */
                  .bubble-pop-up-container {
                    display: flex !important;
                    flex-direction: column !important;
                  }

                  /* Forceer de interne scroll-omgeving */
                  .bubble-cards-stack {
                    padding-bottom: 120px !important; /* Ruimte voor de onderste rij bolletjes */
                    overflow-y: auto !important;
                    overflow-x: hidden !important;
                  }

                  /* Verwijder de harde limiet van de inner wrapper */
                  .bubble-pop-up-inner {
                    max-height: 85vh !important;
                    overflow: visible !important;
                  }
                button_type: name
                auto_close: "20000"
                sub_button:
                  main: []
                  bottom: []
                slider_fill_orientation: left
                slider_value_position: right
              - type: custom:bubble-card
                card_type: separator
                name: Status
                icon: mdi:account-cog
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - entity_id: sensor.aion_logic_scenario
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        name: Aion Scenario
                        show_state: true
                        sub_button: []
                show_empty: false
              - type: custom:auto-entities
                card:
                  type: glance
                  show_name: false
                  show_state: true
                  show_icon: true
                  columns: 4
                filter:
                  include:
                    - domain: person
                sort:
                  method: name
                show_empty: false
              - type: custom:bubble-card
                card_type: separator
                name: Agenda
                icon: mdi:calendar-clock
                styles: |
                  .bubble-line {
                    opacity: 0.5;
                  }
              - type: custom:auto-entities
                card:
                  type: vertical-stack
                card_param: cards
                filter:
                  template: |
                    {% if states('calendar.aion_gezinsagenda') != 'unknown' %}
                      [{
                        "type": "calendar",
                        "initial_view": "listWeek",
                        "title": "Aankomende Afspraken",
                        "entities": ["calendar.aion_gezinsagenda"],
                        "card_mod": {
                          "style": "ha-full-calendar { height: 500px !important; }"
                        }
                      }]
                    {% else %}
                      [{
                        "type": "custom:bubble-card",
                        "card_type": "button",
                        "button_type": "name",
                        "name": "Gezinsagenda niet geconfigureerd",
                        "icon": "mdi:calendar-alert"
                      }]
                    {% endif %}
                  include: []
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Beveiliging
            icon: mdi:shield-home
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Beveiliging
                    icon: mdi:shield-check
                    styles: |
                      .bubble-icon {
                        color: ${state === 'disarmed' ? 'var(--success-color)' : (state === 'triggered' ? 'var(--error-color)' : 'var(--warning-color)')} !important;
                        animation: ${state === 'triggered' ? 'blink 1s infinite' : 'none'};
                      }
                    button_action:
                      tap_action:
                        action: navigate
                        navigation_path: "#security"
                  domain: alarm_control_panel
                - entity_id: sensor.aion_guardian
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Aion Native Guard
                    show_state: true
                    icon: mdi:shield-home
                    styles: |
                      .bubble-icon {
                        color: ${state === 'Veilig' ? 'var(--success-color)' : (state === 'GEVAAR' ? 'var(--error-color)' : 'var(--warning-color)')} !important;
                        animation: ${state === 'GEVAAR' ? 'blink 1s infinite' : 'none'};
                      }
                      .bubble-name {
                         color: ${state === 'GEVAAR' ? 'var(--error-color)' : 'inherit'} !important;
                      }
                      .bubble-state {
                         opacity: 0.7;
                         font-size: 12px;
                      }
                    button_action:
                      tap_action:
                        action: navigate
                        navigation_path: "#security"
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#security"
                name: Beveiliging
                icon: mdi:shield-check
                margin_top: 20px
                button_type: name
                show_header: false
                auto_close: "15000"
                margin_top_mobile: 56px
                bg_opacity: "0"
                bg_blur: "0"
                sub_button:
                  main: []
                  bottom: []
                slider_fill_orientation: left
                slider_value_position: right
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: vertical-stack
                card_param: cards
                filter:
                  include:
                    - domain: alarm_control_panel
                      options:
                        type: alarm-panel
                        states:
                          - arm_home
                          - arm_away
                        theme: bubble-card
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - entity_id: sensor.aion_guardian
                      options:
                        type: custom:bubble-card
                        card_type: separator
                        name: Aion Native Guard
                        icon: mdi:radar
                    - entity_id: sensor.aion_guardian
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        name: Status
                        show_state: true
                        show_attribute: false
                        icon: mdi:shield-search
                        styles: |
                          .bubble-name::after {
                            /* LOGICA: */
                            /* 1. Is het veilig? -> Systeem scant */
                            /* 2. Is het GEVAAR? -> Toon de dreiging (bv. Raam open) */
                            /* 3. Anders (Bewaakt)? -> Zeg 'Actief Beveiligd' ipv null */
                            
                            content: "${ state === 'Veilig' ? 'Systeem scant actief op achtergrond' : (state === 'GEVAAR' ? hass.states['sensor.aion_guardian'].attributes.active_threat : 'Actief Beveiligd') }";
                            display: block;
                            font-size: 11px;
                            opacity: 0.6;
                            padding-top: 4px;
                          }
                          .bubble-icon {
                            color: ${state === 'Veilig' ? 'var(--success-color)' : (state === 'GEVAAR' ? 'var(--error-color)' : 'var(--warning-color)')} !important;
                          }
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Gang
            icon: mdi:stairs-up
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Gang"
            card_mod:
              style: |
                .bubble-icon {
                      color: {{ 'var(--active-state-color)' if expand(area_entities('Gang')) | selectattr('domain', 'in', ['light', 'switch']) | selectattr('state', 'eq', 'on') | list | count > 0 else 'var(--state-icon-color)' }} !important;
                      opacity: {{ '1' if expand(area_entities('Gang')) | selectattr('domain', 'in', ['light', 'switch']) | selectattr('state', 'eq', 'on') | list | count > 0 else '0.5' }} !important;
                    }
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Gang"
                name: Gang Bediening
                icon: mdi:stairs-up
                margin_top_mobile: 56px
                button_type: name
                auto_close: "15000"
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - domain: climate
                      area: Gang
                      options:
                        type: custom:bubble-card
                        card_type: climate
                        sub_button:
                          - name: Mode
                            select_attribute: hvac_modes
                            show_arrow: false
                        show_attribute: true
                        attribute: current_temperature
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  template: >
                    {% set target_area = 'Gang' %}   {# <--- AANPASSEN PER KAMER
                    #}
                        {% set ns = namespace(cards=[]) %}
                        
                        {# We lopen door lichten én schakelaars #}
                        {% set domains = [states.light, states.switch] %}
                        
                        {% for domain in domains %}
                          {% for entity in domain %}
                            
                            {# 1. Check Area #}
                            {% set entity_area = area_name(entity.entity_id) %}
                            
                            {% if entity_area and entity_area | string | lower | trim == target_area | lower | trim %}
                              
                              {# 2. Bepaal type (Slider of Switch) #}
                              {% set button_type = 'switch' %}
                              {% if entity.domain == 'light' %}
                                {% set modes = entity.attributes.supported_color_modes | default([]) %}
                                {% if 'brightness' in modes or 'hs' in modes or 'xy' in modes or 'color_temp' in modes or 'rgb' in modes %}
                                  {% set button_type = 'slider' %}
                                {% endif %}
                              {% endif %}

                              {# 3. Bepaal Kleur & Opaciteit (Jinja2 logica) #}
                              {# Dit vervangt de problematische Javascript code #}
                              {% if entity.state == 'on' %}
                                 {% set icon_color = 'var(--active-state-color)' %}
                                 {% set icon_opacity = '1' %}
                              {% else %}
                                 {% set icon_color = 'var(--state-icon-color)' %}
                                 {% set icon_opacity = '0.5' %}
                              {% endif %}
                              
                              {# 4. Maak de kaart #}
                              {% set card_config = {
                                'type': 'custom:bubble-card',
                                'card_type': 'button',
                                'button_type': button_type,
                                'entity': entity.entity_id,
                                'name': entity.name, 
                                'show_icon': true,
                                'icon': 'mdi:lightbulb',
                                'scrolling_effect': false,
                                'styles': ".bubble-icon, .name {color: white !important;}"
                              } %}
                              
                              {% set ns.cards = ns.cards + [card_config] %}
                              
                            {% endif %}
                          {% endfor %}
                        {% endfor %}
                        
                        {# 5. Sorteer op naam #}
                        {{ ns.cards | sort(attribute='name') }}
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  template: |
                    {% set target_area = 'Gang' %}
                    {% set ns = namespace(cards=[]) %}

                    {% for cov in states.cover %}
                      {% set entity_area = area_name(cov.entity_id) %}
                      
                      {% if entity_area and entity_area | string | lower | trim == target_area | lower | trim %}
                        
                        {% set dev_class = cov.attributes.device_class | default('unknown') %}
                        
                        {% if dev_class != 'garage' and dev_class != 'gate' %}
                          
                          {% set card_config = {
                            'type': 'custom:bubble-card',
                            'card_type': 'cover',
                            'entity': cov.entity_id,
                            'name': cov.name,
                            'show_icon': true,
                            'sub_button': []
                          } %}
                          
                          {% set ns.cards = ns.cards + [card_config] %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}

                    {{ ns.cards | sort(attribute='name') }}
                show_empty: false
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  template: >
                    {% set target_area = 'Gang' %}  {# <--- HIER VUL JE DE NAAM
                    IN #}

                    {% set ns = namespace(cards=[]) %}


                    {# Lijst van types die we willen zien #}

                    {% set target_classes = ['window', 'door', 'garage_door',
                    'opening'] %}


                    {% for sensor in states.binary_sensor %}
                      {# 1. Haal ruimte en device_class op (veilig) #}
                      {% set current_area = area_name(sensor.entity_id) | string | lower | trim %}
                      {% set dev_class = sensor.attributes.device_class | default('unknown') %}
                      
                      {# 2. Check: Juiste Ruimte? #}
                      {% if current_area == target_area | lower | trim %}
                        
                        {# 3. Check: Juiste Type? (Raam, deur, etc.) #}
                        {% if dev_class in target_classes %}
                          
                          {# 4. Bouw de kaart #}
                          {% set card_config = {
                            'type': 'custom:bubble-card',
                            'card_type': 'button',
                            'button_type': 'state',
                            'entity': sensor.entity_id,
                            'name': sensor.name,
                            'show_last_changed': true,
                            'card_mod': {
                              'style': ".bubble-icon { color: " + ('var(--error-color)' if sensor.state == 'on' else 'var(--state-icon-color)') + " !important; opacity: " + ('1' if sensor.state == 'on' else '0.5') + " !important; }"
                            }
                          } %}
                          {% set ns.cards = ns.cards + [card_config] %}
                          
                        {% endif %}
                      {% endif %}
                    {% endfor %}


                    {# Sorteer: Open ramen (on) eerst! #}

                    {{ ns.cards | sort(attribute='state', reverse=true) }}
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Woonkamer
            icon: mdi:sofa
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Woonkamer"
            card_mod:
              style: |
                .bubble-icon {
                      color: {{ 'var(--active-state-color)' if expand(area_entities('Woonkamer')) | selectattr('domain', 'in', ['light', 'switch']) | selectattr('state', 'eq', 'on') | list | count > 0 else 'var(--state-icon-color)' }} !important;
                      opacity: {{ '1' if expand(area_entities('Woonkamer')) | selectattr('domain', 'in', ['light', 'switch']) | selectattr('state', 'eq', 'on') | list | count > 0 else '0.5' }} !important;
                    }
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Woonkamer"
                name: Woonkamer Bediening
                icon: mdi:sofa
                margin_top_mobile: 56px
                button_type: name
                auto_close: "15000"
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - domain: climate
                      area: Woonkamer
                      options:
                        type: custom:bubble-card
                        card_type: climate
                        sub_button:
                          - name: Mode
                            select_attribute: hvac_modes
                            show_arrow: false
                        show_attribute: true
                        attribute: current_temperature
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  template: >
                    {% set target_area = 'Woonkamer' %}   {# <--- AANPASSEN PER
                    KAMER #}
                        {% set ns = namespace(cards=[]) %}
                        
                        {# We lopen door lichten én schakelaars #}
                        {% set domains = [states.light, states.switch] %}
                        
                        {% for domain in domains %}
                          {% for entity in domain %}
                            
                            {# 1. Check Area #}
                            {% set entity_area = area_name(entity.entity_id) %}
                            
                            {% if entity_area and entity_area | string | lower | trim == target_area | lower | trim %}
                              
                              {# 2. Bepaal type (Slider of Switch) #}
                              {% set button_type = 'switch' %}
                              {% if entity.domain == 'light' %}
                                {% set modes = entity.attributes.supported_color_modes | default([]) %}
                                {% if 'brightness' in modes or 'hs' in modes or 'xy' in modes or 'color_temp' in modes or 'rgb' in modes %}
                                  {% set button_type = 'slider' %}
                                {% endif %}
                              {% endif %}

                              {# 3. Bepaal Kleur & Opaciteit (Jinja2 logica) #}
                              {# Dit vervangt de problematische Javascript code #}
                              {% if entity.state == 'on' %}
                                 {% set icon_color = 'var(--active-state-color)' %}
                                 {% set icon_opacity = '1' %}
                              {% else %}
                                 {% set icon_color = 'var(--state-icon-color)' %}
                                 {% set icon_opacity = '0.5' %}
                              {% endif %}
                              
                              {# 4. Maak de kaart #}
                              {% set card_config = {
                                'type': 'custom:bubble-card',
                                'card_type': 'button',
                                'button_type': button_type,
                                'entity': entity.entity_id,
                                'name': entity.name, 
                                'show_icon': true,
                                'icon': 'mdi:lightbulb',
                                'scrolling_effect': false,
                                'styles': ".bubble-icon, .name {color: white !important;}"
                              } %}
                              
                              {% set ns.cards = ns.cards + [card_config] %}
                              
                            {% endif %}
                          {% endfor %}
                        {% endfor %}
                        
                        {# 5. Sorteer op naam #}
                        {{ ns.cards | sort(attribute='name') }}
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  template: |
                    {% set target_area = 'Woonkamer' %}
                    {% set ns = namespace(cards=[]) %}

                    {% for cov in states.cover %}
                      {% set entity_area = area_name(cov.entity_id) %}
                      
                      {% if entity_area and entity_area | string | lower | trim == target_area | lower | trim %}
                        
                        {% set dev_class = cov.attributes.device_class | default('unknown') %}
                        
                        {% if dev_class != 'garage' and dev_class != 'gate' %}
                          
                          {% set card_config = {
                            'type': 'custom:bubble-card',
                            'card_type': 'cover',
                            'entity': cov.entity_id,
                            'name': cov.name,
                            'show_icon': true,
                            'sub_button': []
                          } %}
                          
                          {% set ns.cards = ns.cards + [card_config] %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}

                    {{ ns.cards | sort(attribute='name') }}
                show_empty: false
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  template: >
                    {% set target_area = 'Woonkamer' %}  {# <--- HIER VUL JE DE
                    NAAM IN #}

                    {% set ns = namespace(cards=[]) %}


                    {# Lijst van types die we willen zien #}

                    {% set target_classes = ['window', 'door', 'garage_door',
                    'opening'] %}


                    {% for sensor in states.binary_sensor %}
                      {# 1. Haal ruimte en device_class op (veilig) #}
                      {% set current_area = area_name(sensor.entity_id) | string | lower | trim %}
                      {% set dev_class = sensor.attributes.device_class | default('unknown') %}
                      
                      {# 2. Check: Juiste Ruimte? #}
                      {% if current_area == target_area | lower | trim %}
                        
                        {# 3. Check: Juiste Type? (Raam, deur, etc.) #}
                        {% if dev_class in target_classes %}
                          
                          {# 4. Bouw de kaart #}
                          {% set card_config = {
