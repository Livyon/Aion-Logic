                        Accent kleur */ .bubble-icon {
                          color: {{ '#00e676' if 'Geoptimaliseerd' in states(config.entity) else 'var(--accent-color)' }} !important;
                          animation: {{ 'pulse 2s infinite' if 'Geoptimaliseerd' in states(config.entity) else 'none' }};
                        }

                        /* Maak de status tekst iets kleiner */ .bubble-state {
                          opacity: 0.7;
                          font-size: 12px !important;
                        }

                        /* Toon de menselijke feedback onder de naam */
                        .bubble-name::after {
                          content: "{{ state_attr(config.entity, 'feedback_message') | default('Klaar voor analyse van de volgende stookcyclus.') }}";
                          display: block;
                          font-size: 11px;
                          opacity: 0.8;
                          font-weight: normal;
                          margin-top: 4px;
                          white-space: normal;
                          line-height: 1.2;
                        }
                  entity_id: sensor.aion_logic_brain
            show_empty: false
          - type: custom:bubble-card
            card_type: separator
            name: Huishouden
            icon: mdi:home-analytics
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              template: |
                {% set ns = namespace(found=false) %}
                        {# 1. Zoek of er minstens één afval-sensor bestaat #}
                        {% set keywords = ['recycleapp', 'afval', 'restafval', 'pmd', 'gft', 'papier', 'glas'] %}
                        {% for s in states.sensor %}
                          {% if not ns.found %}
                            {% for word in keywords %}
                              {% if word in s.entity_id %}
                                {% set ns.found = true %}
                              {% endif %}
                            {% endfor %}
                          {% endif %}
                        {% endfor %}

                        {# 2. Als gevonden: Toon de knop #}
                        {% if ns.found %}
                          {{
                            [
                              {
                                'type': 'custom:bubble-card',
                                'card_type': 'button',
                                'button_type': 'name',
                                'name': 'Afvalophaling',
                                'icon': 'mdi:trash-can-outline',
                                'scrolling_effect': false,
                                'button_action': {
                                  'tap_action': {
                                    'action': 'navigate',
                                    'navigation_path': '#AfvalbeheerInfo'
                                  }
                                }
                              }
                            ]
                          }}
                        {% endif %}
            show_empty: false
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#AfvalbeheerInfo"
                name: Afvalkalender
                icon: mdi:trash-can
                margin_top_mobile: 56px
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - entity_id: "*restafval*"
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                        button_action:
                          tap_action:
                            action: more-info
                    - entity_id: "*pmd*"
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                        button_action:
                          tap_action:
                            action: more-info
                    - entity_id: "*papier*"
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                        button_action:
                          tap_action:
                            action: more-info
                    - entity_id: "*gft*"
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                        button_action:
                          tap_action:
                            action: more-info
                    - entity_id: "*glas*"
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                        button_action:
                          tap_action:
                            action: more-info
                    - entity_id: "*recycleapp*"
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                        button_action:
                          tap_action:
                            action: more-info
                  exclude:
                    - state: unavailable
                    - state: unknown
                    - state: Geen
                    - state: "off"
                    - entity_id: "*vandaag*"
                    - entity_id: "*morgen*"
                    - entity_id: "*eerstvolgende*"
                    - entity_id: "*first_next*"
                    - entity_id: "*datums*"
                    - entity_id: "*dates*"
                    - entity_id: "*picture*"
                    - entity_id: "*event*"
                unique: true
                sort:
                  method: state
                show_empty: false
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Verwarming & Ketel
            icon: mdi:fire-circle
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Overzicht / info
            icon: mdi:information-variant-box
            scrolling_effect: false
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Verwarming&Ketel"
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Verwarming&Ketel"
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        name: null
                        icon: mdi:water-boiler
                        show_attribute: true
                        attribute: current_temperature
                        sub_button:
                          - name: Status
                            select_attribute: operation_mode
                            show_background: false
                      domain: water_heater
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*water_pressure*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*water_druk*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: name
                        name: >
                          {state === 'off' || state === '0' ? 'Geen storingen' :
                          'STORING: ' +state}
                        icon: mdi:alert-circle-check
                        styles: |-
                          .bubble-icon {
                            color: ${state === 'off' || state === '0' ? 'var(--success-color)' : 'var(--error-color)'} !important;}
                      entity_id: "*ambisense*trouble_codes*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*ambisense*firmware*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*ambisense*online*"
                  exclude:
                    - options: {}
                      state: unavailable
                    - options: {}
                      state: unknown
                show_empty: false
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Zone Overzicht
            icon: mdi:thermostat-box-auto
          - type: custom:bubble-card
            card_type: button
            button_type: name
            scrolling_effect: false
            name: Klimaat entiteiten
            icon: mdi:home-thermometer
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#ZoneOverzicht"
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                name: Zone Overzicht
                icon: mdi:thermostat-box-auto
                button_type: name
                hash: "#ZoneOverzicht"
                show_header: false
                auto_close: "15000"
                sub_button:
                  main: []
                  bottom: []
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - options:
                        type: custom:bubble-card
                        card_type: climate
                        sub_button:
                          - name: Mode
                            select_attribute: hvac_modes
                            show_arrow: false
                            state_background: false
                        show_attribute: true
                        attribute: current_temperature
                        show_name: true
                        show_state: false
                        scrolling_effect: false
                        styles: ""
                      domain: climate
                  exclude:
                    - options: {}
                      state: unavailable
                    - options: {}
                      state: unknown
                show_empty: false
    cards: []
