views:
  - title: Home
    sections:
      - "0":
          type: vertical-stack
          card_mod: null
          cards:
            - type: custom:bubble-card
              card_type: pop-up
              hash: "#Security"
              name: Beveiliging
              icon: mdi:shield-check
              margin_top_mobile: 56px
              button_type: name
              auto_close: "30000"
            - type: custom:auto-entities
              card:
                type: grid
                columns: 1
                square: false
              card_param: cards
              filter:
                include:
                  - domain: alarm_control_panel
                    options:
                      type: alarm-panel
                      states:
                        - arm_home
                        - arm_away
                      name: Systeem Status
              show_empty: false
            - type: custom:bubble-card
              card_type: separator
              name: Sensoren Status
              icon: mdi:window-closed-variant
            - type: custom:auto-entities
              card:
                type: grid
                columns: 1
                square: false
              card_param: cards
              filter:
                include:
                  - domain: binary_sensor
                    state: "on"
                    attributes:
                      device_class: window
                    options:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      show_state: true
                      icon: mdi:window-open-variant
                      styles: |
                        .bubble-icon { color: var(--error-color) !important; }
                  - domain: binary_sensor
                    state: "on"
                    attributes:
                      device_class: door
                    options:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      show_state: true
                      icon: mdi:door-open
                      styles: |
                        .bubble-icon { color: var(--error-color) !important; }
                  - domain: binary_sensor
                    state: "on"
                    attributes:
                      device_class: motion
                    options:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      name: Beweging Gedetecteerd
                      icon: mdi:motion-sensor
                      styles: |
                        .bubble-icon { color: var(--warning-color) !important; }
                exclude:
                  - state: unavailable
                  - state: unknown
              else:
                type: custom:bubble-card
                card_type: button
                button_type: name
                name: Alles is veilig gesloten
                icon: mdi:check-circle
                styles: |
                  .bubble-icon { color: var(--success-color) !important; }
      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |
            {% for alarm in states.alarm_control_panel %}
              {% if alarm.state == 'triggered' or alarm.state == 'pending' %}
                {{
                  {
                    'type': 'custom:bubble-card',
                    'card_type': 'button',
                    'button_type': 'name',
                    'entity': alarm.entity_id,
                    'name': 'ALARM GEACTIVEERD!',
                    'icon': 'mdi:alert-box',
                    'styles': "
                      .bubble-button-card-container {
                        background: red !important;
                        animation: flash 1s infinite;
                      }
                      .bubble-name, .bubble-icon {
                        color: white !important;
                        font-weight: bold;
                      }
                      @keyframes flash {
                        0% { opacity: 1; }
                        50% { opacity: 0.6; }
                        100% { opacity: 1; }
                      }
                    ",
                    'button_action': {
                      'tap_action': {
                        'action': 'navigate',
                        'navigation_path': '#Security'
                      }
                    }
                  }
                }},
              {% elif alarm.state != 'disarmed' %}
                {{
                  {
                    'type': 'custom:bubble-card',
                    'card_type': 'button',
                    'button_type': 'name',
                    'entity': alarm.entity_id,
                    'name': 'Systeem Ingeschakeld',
                    'icon': 'mdi:shield-lock',
                    'styles': "
                      .bubble-button-card-container {
                        background: var(--primary-color) !important;
                        opacity: 0.8;
                      }
                      .bubble-icon {
                        color: white !important;
                      }
                    ",
                    'button_action': {
                      'tap_action': {
                        'action': 'navigate',
                        'navigation_path': '#Security'
                      }
                    }
                  }
                }},
              {% endif %}
            {% endfor %}
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Info & Planning
            icon: mdi:information-variant
            sub_button:
              main: []
              bottom: []
            card_layout: normal
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:bubble-card
                card_type: button
                sub_button:
                  main: []
                  bottom: []
                button_type: state
                entity: weather.forecast_thuis
                slider_fill_orientation: left
                slider_value_position: right
                scrolling_effect: false
                show_name: true
                show_state: true
                show_last_changed: false
                show_attribute: true
                attribute: temperature
                button_action: {}
                card_layout: normal
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Info & Status
                icon: mdi:information-box-outline
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: "#Info"
                sub_button:
                  main: []
                  bottom: []
                slider_fill_orientation: left
                slider_value_position: right
                card_layout: normal
                card_mod:
                  style: |
                    .bubble-icon {
                      color: var(--state-icon-color) !important;
                    }
          - type: vertical-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: pop-up
                    hash: "#Info"
                    name: Info Centrum
                    icon: mdi:information
                    margin_top_mobile: 56px
                    styles: |
                      .bubble-pop-up-container {
                        display: flex !important;
                        flex-direction: column !important;
                      }
                      .bubble-cards-stack {
                        padding-bottom: 120px !important; 
                        overflow-y: auto !important;
                        overflow-x: hidden !important;
                      }
                      .bubble-pop-up-inner {
                        max-height: 85vh !important;
                        overflow: visible !important;
                      }
                    button_type: name
                    auto_close: "20000"
                    sub_button:
                      main: []
                      bottom: []
                    slider_fill_orientation: left
                    slider_value_position: right
                    card_layout: normal
                  - type: custom:bubble-card
                    card_type: separator
                    name: Status
                    icon: mdi:account-cog
                  - type: custom:auto-entities
                    card:
                      type: grid
                      columns: 1
                      square: false
                    card_param: cards
                    filter:
                      include:
                        - entity_id: sensor.aion_logic_scenario
                          options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            name: Aion Scenario
                            show_state: true
                            sub_button: []
                    show_empty: false
                  - type: custom:auto-entities
                    card:
                      type: glance
                      show_name: false
                      show_state: true
                      show_icon: true
                      columns: 4
                    filter:
                      include:
                        - domain: person
                    sort:
                      method: name
                    show_empty: false
                  - type: custom:bubble-card
                    card_type: separator
                    name: Agenda
                    icon: mdi:calendar-clock
                    styles: |
                      .bubble-line { opacity: 0.5; }
                  - type: custom:auto-entities
                    card:
                      type: vertical-stack
                    card_param: cards
                    filter:
                      template: >
                        {% if states('calendar.aion_gezinsagenda') != 'unknown' %}[{
                            "type": "calendar",
                            "initial_view": "listWeek",
                            "title": "Aankomende Afspraken",
                            "entities":["calendar.aion_gezinsagenda"],
                            "card_mod": {
                              "style": "ha-full-calendar { height: 500px !important; }"
                            }
                          }]
                        {% else %}[{
                            "type": "custom:bubble-card",
                            "card_type": "button",
                            "button_type": "name",
                            "name": "Gezinsagenda niet geconfigureerd",
                            "icon": "mdi:calendar-alert"
                          }]
                        {% endif %}
                      include: []
                  - type: custom:bubble-card
                    card_type: separator
                    name: Huishouden
                    icon: mdi:home-analytics
                  - type: custom:auto-entities
                    card:
                      type: grid
                      columns: 1
                      square: false
                    card_param: cards
                    filter:
                      template: >
                        {% set ns = namespace(found=false) %}
                        {% set keywords =['recycleapp', 'afval', 'restafval', 'pmd', 'gft', 'papier', 'glas'] %}
                        {% for s in states.sensor %}
                          {% if not ns.found %}
                            {% for word in keywords %}
                              {% if word in s.entity_id %}
                                {% set ns.found = true %}
                              {% endif %}
                            {% endfor %}
                          {% endif %}
                        {% endfor %}
                        {% if ns.found %}
                          {{[
                              {
                                'type': 'custom:bubble-card',
                                'card_type': 'button',
                                'button_type': 'name',
                                'name': 'Afvalophaling',
                                'icon': 'mdi:trash-can-outline',
                                'scrolling_effect': false,
                                'button_action': {
                                  'tap_action': {
                                    'action': 'navigate',
                                    'navigation_path': '#AfvalbeheerInfo'
                                  }
                                }
                              }
                            ]
                          }}
                        {% endif %}
                    show_empty: false
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: pop-up
                    hash: "#AfvalbeheerInfo"
                    name: Afvalkalender
                    icon: mdi:trash-can
                    margin_top_mobile: 56px
                  - type: custom:auto-entities
                    card:
                      type: grid
                      columns: 1
                      square: false
                    card_param: cards
                    filter:
                      include:
                        - options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            show_icon: true
                            scrolling_effect: false
                            button_action:
                              tap_action:
                                action: more-info
                          entity_id: "*restafval*"
                        - options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            show_icon: true
                            scrolling_effect: false
                            button_action:
                              tap_action:
                                action: more-info
                          entity_id: "*pmd*"
                        - options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            show_icon: true
                            scrolling_effect: false
                            button_action:
                              tap_action:
                                action: more-info
                          entity_id: "*papier*"
                        - options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            show_icon: true
                            scrolling_effect: false
                            button_action:
                              tap_action:
                                action: more-info
                          entity_id: "*gft*"
                        - options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            show_icon: true
                            scrolling_effect: false
                            button_action:
                              tap_action:
                                action: more-info
                          entity_id: "*glas*"
                        - options:
                            type: custom:bubble-card
                            card_type: button
                            button_type: state
                            show_icon: true
                            scrolling_effect: false
                            button_action:
                              tap_action:
                                action: more-info
                          entity_id: "*recycleapp*"
                      exclude:
                        - options: {}
                          state: unavailable
                        - options: {}
                          state: unknown
                        - options: {}
                          state: Geen
                        - options: {}
                          state: "off"
                        - options: {}
                          entity_id: "*vandaag*"
                        - options: {}
                          entity_id: "*morgen*"
                        - options: {}
                          entity_id: "*eerstvolgende*"
                        - options: {}
                          entity_id: "*first_next*"
                        - options: {}
                          entity_id: "*datums*"
                        - options: {}
                          entity_id: "*dates*"
                        - options: {}
                          entity_id: "*picture*"
                        - options: {}
                          entity_id: "*event*"
                    unique: true
                    sort:
                      method: state
                    show_empty: false
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Beveiliging
            icon: mdi:shield-home
            sub_button:
              main: []
              bottom: []
            card_layout: normal
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Beveiliging
                    icon: mdi:shield-check
                    styles: |
                      .bubble-icon {
                        color: ${state === 'disarmed' ? 'var(--success-color)' : (state === 'triggered' ? 'var(--error-color)' : 'var(--warning-color)')} !important;
                        animation: ${state === 'triggered' ? 'blink 1s infinite' : 'none'};
                      }
                    button_action:
                      tap_action:
                        action: navigate
                        navigation_path: "#security"
                  domain: alarm_control_panel
                - entity_id: sensor.aion_guardian
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Aion Native Guard
                    show_state: true
                    icon: mdi:shield-home
                    styles: |
                      .bubble-icon {
                        color: ${state === 'Veilig' ? 'var(--success-color)' : (state === 'GEVAAR' ? 'var(--error-color)' : 'var(--warning-color)')} !important;
                        animation: ${state === 'GEVAAR' ? 'blink 1s infinite' : 'none'};
                      }
                      .bubble-name {
                         color: ${state === 'GEVAAR' ? 'var(--error-color)' : 'inherit'} !important;
                      }
                      .bubble-state {
                         opacity: 0.7;
                         font-size: 12px;
                      }
                    button_action:
                      tap_action:
                        action: navigate
                        navigation_path: "#security"
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#security"
                name: Beveiliging
                icon: mdi:shield-check
                margin_top: 20px
                button_type: name
                show_header: false
                auto_close: "15000"
                margin_top_mobile: 56px
                bg_opacity: "0"
                bg_blur: "0"
                sub_button:
                  main: []
                  bottom: []
                slider_fill_orientation: left
                slider_value_position: right
                card_layout: normal
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: vertical-stack
                card_param: cards
                filter:
                  include:
                    - domain: alarm_control_panel
                      options:
                        type: alarm-panel
                        states:
                          - arm_home
                          - arm_away
                        theme: bubble-card
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - entity_id: sensor.aion_guardian
                      options:
                        type: custom:bubble-card
                        card_type: separator
                        name: Aion Native Guard
                        icon: mdi:radar
                    - entity_id: sensor.aion_guardian
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        name: Status
                        show_state: true
                        show_attribute: false
                        icon: mdi:shield-search
                        styles: |
                          .bubble-name::after {
                            content: "${ state === 'Veilig' ? 'Systeem scant actief op achtergrond' : (state === 'GEVAAR' ? hass.states['sensor.aion_guardian'].attributes.active_threat : 'Actief Beveiligd') }";
                            display: block;
                            font-size: 11px;
                            opacity: 0.6;
                            padding-top: 4px;
                          }
                          .bubble-icon {
                            color: ${state === 'Veilig' ? 'var(--success-color)' : (state === 'GEVAAR' ? 'var(--error-color)' : 'var(--warning-color)')} !important;
                          }
                    - entity_id: switch.aion_logic_aion_guard_master
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: switch
                        name: Guard Master
                        icon: mdi:shield-lock
                        show_state: false
                        styles: |
                          .bubble-button-background { background: var(--bubble-secondary-background-color) !important; opacity: 1 !important; }
                          .bubble-icon { color: ${state === 'on' ? 'var(--success-color)' : 'var(--state-icon-color)'} !important; }
                    - entity_id: switch.aion_logic_aion_guard_pauze
                      options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: switch
                        name: Guard Pauze (15 min)
                        icon: mdi:pause-circle-outline
                        show_state: false
                        styles: |
                          .bubble-button-background { background: var(--bubble-secondary-background-color) !important; opacity: 1 !important; }
                          .bubble-icon { color: ${state === 'on' ? 'var(--warning-color)' : 'var(--state-icon-color)'} !important; }
      ##AION_ROOMS_PLACEHOLDER##
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Huis Modi
            icon: mdi:home-clock
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Modi"
            sub_button:
              main: []
              bottom: []
            slider_fill_orientation: left
            slider_value_position: right
            card_layout: normal
            card_mod:
              style: |
                .bubble-icon {
                  color: {{ 'var(--active-state-color)' if is_state('switch.aion_logic_aion_guest_mode', 'on') else 'var(--state-icon-color)' }} !important;
                  opacity: {{ '1' if is_state('switch.aion_logic_aion_guest_mode', 'on') else '0.6' }} !important;
                }
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Modi"
                name: Huis Instellingen
                icon: mdi:home-clock
                margin_top_mobile: 56px
                button_type: name
                auto_close: "15000"
                sub_button:
                  main: []
                  bottom: []
                card_layout: normal
              - type: custom:bubble-card
                card_type: separator
                name: Aanwezigheid
                icon: mdi:account-group
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: switch.aion_logic_aion_guest_mode
                name: Gasten / Babysit Modus
                icon: mdi:account-multiple-check
                show_state: true
                styles: |
                  .bubble-button-background { background: var(--bubble-secondary-background-color) !important; opacity: 1 !important; }
                  .bubble-icon { color: ${state === 'on' ? 'var(--active-state-color)' : 'var(--state-icon-color)'} !important; }
                sub_button:
                  main:
                    - name: Houdt huis warm als bewoners weg zijn
                      icon: mdi:information-outline
                      show_background: false
                  bottom: []
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Voice Assist
            icon: mdi:account-voice
            button_action:
              tap_action:
                action: assist
                pipeline_id: preferred
                start_listening: true
            sub_button:
              main: []
              bottom: []
            card_layout: normal
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Camera's & Beveiliging
            icon: mdi:cctv
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Cameras"
            sub_button:
              main: []
              bottom: []
            card_layout: normal
            card_mod:
              style: |
                .bubble-icon { color: var(--state-icon-color) !important; }
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Cameras"
                name: Live Beelden
                icon: mdi:cctv
                margin_top_mobile: 56px
                width_desktop: 600px
                button_type: name
                auto_close: "20000"
                sub_button:
                  main: []
                  bottom: []
                card_layout: normal
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - domain: camera
                      options:
                        type: picture-entity
                        show_state: false
                        show_name: true
                        camera_view: live
                        aspect_ratio: "16:9"
                        tap_action:
                          action: more-info
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; border: none; margin-bottom: 12px; }
                show_empty: false
                else:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Geen camera's gevonden
                  icon: mdi:camera-off
                  styles: ".bubble-icon { opacity: 0.5; }"
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Media & TV
            icon: mdi:music-box-multiple
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Media"
            sub_button:
              main: []
              bottom: []
            card_layout: normal
            card_mod:
              style: |
                .bubble-icon {
                  color: {{ 'var(--active-state-color)' if states.media_player | selectattr('state', 'eq', 'playing') | list | count > 0 else 'var(--state-icon-color)' }} !important;
                  animation: {{ 'pulse 2s infinite' if states.media_player | selectattr('state', 'eq', 'playing') | list | count > 0 else 'none' }};
                }
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Media"
                name: Media Spelers
                icon: mdi:cast-audio
                margin_top_mobile: 56px
                button_type: name
                auto_close: "15000"
                sub_button:
                  main: []
                  bottom: []
                card_layout: normal
              - type: custom:bubble-card
                card_type: separator
                name: Nu aan het spelen
                icon: mdi:play-circle-outline
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - domain: media_player
                      state: playing
                      options:
                        type: custom:bubble-card
                        card_type: media-player
                        show_attribute: false
                  exclude:
                    - state: unavailable
                    - state: unknown
                show_empty: false
              - type: custom:bubble-card
                card_type: separator
                name: Alle Apparaten
                icon: mdi:speaker-multiple
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - domain: media_player
                      state: "on"
                      options:
                        type: custom:bubble-card
                        card_type: media-player
                    - domain: media_player
                      state: paused
                      options:
                        type: custom:bubble-card
                        card_type: media-player
                    - domain: media_player
                      state: idle
                      options:
                        type: custom:bubble-card
                        card_type: media-player
                    - domain: media_player
                      state: "off"
                      options:
                        type: custom:bubble-card
                        card_type: media-player
                        show_state: true
                  exclude:
                    - state: unavailable
                    - state: unknown
                    - entity_id: "*browser*"
                    - entity_id: "*web_r*"
    type: sections
    max_columns: 2
    cards: []
    icon: mdi:home
    badges: []
    dense_section_placement: true
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
  - title: Info & Diagnose
    path: info-diagnose
    icon: mdi:wrench-clock
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Onderhoud & Waarschuwingen
            icon: mdi:alert-circle-outline
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: battery
                  state: < 20
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    show_attribute: true
                    icon: mdi:battery-10
                    styles: >
                      .bubble-button-background { background: rgba(255, 0, 0, 0.2) !important; opacity: 1 !important; }
                      .bubble-icon { color: var(--error-color) !important; }
                - domain: binary_sensor
                  attributes:
                    device_class: battery
                  state: "on"
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: "{friendly_name} is bijna leeg"
                    icon: mdi:battery-alert
                    styles: >
                      .bubble-button-background { background: rgba(255, 0, 0, 0.2) !important; opacity: 1 !important; }
                      .bubble-icon { color: var(--error-color) !important; }
              exclude:
                - state: unavailable
                - state: unknown
            else:
              type: custom:bubble-card
              card_type: button
              button_type: name
              name: Alle batterijen zijn in orde
              icon: mdi:battery-check
              styles: |
                .bubble-icon { color: var(--success-color) !important; }
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: window
                  state: "on"
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    show_last_changed: true
                    styles: >
                      .bubble-button-background { background: rgba(255, 0, 0, 0.2) !important; opacity: 1 !important; }
                      .bubble-icon { color: var(--error-color) !important; }
                - domain: binary_sensor
                  attributes:
                    device_class: door
                  state: "on"
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    show_last_changed: true
                    styles: >
                      .bubble-button-background { background: rgba(255, 0, 0, 0.2) !important; opacity: 1 !important; }
                      .bubble-icon { color: var(--error-color) !important; }
                - domain: binary_sensor
                  attributes:
                    device_class: garage_door
                  state: "on"
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    show_last_changed: true
                    styles: >
                      .bubble-button-background { background: rgba(255, 0, 0, 0.2) !important; opacity: 1 !important; }
                      .bubble-icon { color: var(--error-color) !important; }
                - domain: binary_sensor
                  attributes:
                    device_class: opening
                  state: "on"
                  options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    show_last_changed: true
                    styles: >
                      .bubble-button-background { background: rgba(255, 0, 0, 0.2) !important; opacity: 1 !important; }
                      .bubble-icon { color: var(--error-color) !important; }
            else:
              type: custom:bubble-card
              card_type: button
              button_type: name
              name: Alle ramen en deuren zijn gesloten
              icon: mdi:window-closed-variant
              styles: |
                .bubble-icon { color: var(--success-color) !important; }
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Aion Logic Systeem
            icon: mdi:brain
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    name: Actief Scenario
                    icon: mdi:calendar-clock
                    show_state: true
                    card_mod:
                      style: |
                        .bubble-icon { color: var(--accent-color) !important; }
                  entity_id: sensor.aion_logic_scenario
                - options:
                    type: custom:bubble-card
                    card_type: button
                    button_type: state
                    name: Aion Neural Core
                    icon: mdi:brain
                    show_state: true
                    card_mod:
                      style: >
                        .bubble-icon {
                          color: {{ '#00e676' if 'Geoptimaliseerd' in states(config.entity) else 'var(--accent-color)' }} !important;
                          animation: {{ 'pulse 2s infinite' if 'Geoptimaliseerd' in states(config.entity) else 'none' }};
                        }
                        .bubble-state { opacity: 0.7; font-size: 12px !important; }
                        .bubble-name::after {
                          content: "{{ state_attr(config.entity, 'feedback_message') | default('Klaar voor analyse van de volgende stookcyclus.') }}";
                          display: block; font-size: 11px; opacity: 0.8; font-weight: normal; margin-top: 4px; white-space: normal; line-height: 1.2;
                        }
                  entity_id: sensor.aion_logic_brain
            show_empty: false
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Verwarming & Ketel
            icon: mdi:fire-circle
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Overzicht / info
            icon: mdi:information-variant-box
            scrolling_effect: false
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#Verwarming&Ketel"
          - type: custom:bubble-card
            card_type: button
            button_type: name
            scrolling_effect: false
            name: Klimaat entiteiten
            icon: mdi:home-thermometer
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#ZoneOverzicht"
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#Verwarming&Ketel"
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        name: null
                        icon: mdi:water-boiler
                        show_attribute: true
                        attribute: current_temperature
                        sub_button:
                          - name: Status
                            select_attribute: operation_mode
                            show_background: false
                      domain: water_heater
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*water_pressure*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*water_druk*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: name
                        name: >
                          {state === 'off' || state === '0' ? 'Geen storingen' : 'STORING: ' +state}
                        icon: mdi:alert-circle-check
                        styles: |-
                          .bubble-icon { color: ${state === 'off' || state === '0' ? 'var(--success-color)' : 'var(--error-color)'} !important;}
                      entity_id: "*ambisense*trouble_codes*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*ambisense*firmware*"
                    - options:
                        type: custom:bubble-card
                        card_type: button
                        button_type: state
                        show_icon: true
                        scrolling_effect: false
                      entity_id: "*ambisense*online*"
                  exclude:
                    - options: {}
                      state: unavailable
                    - options: {}
                      state: unknown
                show_empty: false
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                name: Zone Overzicht
                icon: mdi:thermostat-box-auto
                button_type: name
                hash: "#ZoneOverzicht"
                show_header: false
                auto_close: "15000"
                sub_button:
                  main: []
                  bottom: []
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  include:
                    - options:
                        type: custom:bubble-card
                        card_type: climate
                        sub_button:
                          - name: Mode
                            select_attribute: hvac_modes
                            show_arrow: false
                            state_background: false
                        show_attribute: true
                        attribute: current_temperature
                        show_name: true
                        show_state: false
                        scrolling_effect: false
                        styles: >
                          .bubble-button-card-container, .bubble-button-background, .bubble-climate-background {
                            background: var(--bubble-secondary-background-color) !important;
                            background-color: var(--bubble-secondary-background-color) !important;
                            opacity: 1 !important;
                          }
                          .bubble-icon {
                            color: ${state === 'heat' || state === 'auto' ? 'var(--warning-color)' : (state === 'cool' ? 'var(--info-color)' : 'var(--state-icon-color)')} !important;
                          }
                      domain: climate
                  exclude:
                    - options: {}
                      state: unavailable
                    - options: {}
                      state: unknown
                show_empty: false
    cards:
